<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf‑8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Courses – Track Demo</title>
  <style>
    /* minimal styling – copy your existing CSS where you want */
    body {font-family:sans-serif;margin:0;padding:0}
    .course {margin:1rem 0}
    button, a{cursor:pointer}
  </style>
</head>
<body>

<header>
  <nav>
    <ul>
      <li><a href="#courses">Courses</a></li>
      <li><a href="#contact">Contact</a></li>
      <li><a href="#" class="track-link" data-action="Enroll">Enroll now →</a></li>
    </ul>
  </nav>
</header>

<main id="courses">
  <h1>Look‑Max 101</h1>
  <p>Learn... etc.</p>
  <a href="#" class="track-link" data-action="Enroll">Enroll now →</a>
</main>

<script>
  // --------------------------------------------------------------------
  // 1️⃣  Tell the browser that we’ll do an async tracking call.
  // --------------------------------------------------------------------
  async function track(action) {
    // Grab IP & geo *once*
    const [geo, ip] = await Promise.all([getIPGeolocation(), getIP()]);
    const payload = {
      action,
      ip: ip || 'unknown',
      geo: geo || 'unknown',
      userAgent: navigator.userAgent
    };

    // Send to your server-side endpoint – it will forward to Discord
    try {
      await fetch('https://<YOUR‑WORKER‑DOMAIN>/track', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      console.log('Tracking sent', payload);
    } catch (e) {
      console.warn('Tracking failed', e);
    }
  }

  function getIPGeolocation() {
    // use a free public service, e.g. http://ip-api.com/json/
    return fetch('https://ip-api.com/json/')
      .then(r => r.json())
      .then(r => r.city + ', ' + r.regionName + ', ' + r.country);
  }

  function getIP() {
    // raw IP – ipify
    return fetch('https://api.ipify.org?format=json')
      .then(r => r.json())
      .then(r => r.ip);
  }

  // --------------------------------------------------------------------
  // 2️⃣  Attach click listeners to links you want to track
  // --------------------------------------------------------------------
  document.addEventListener('click', async e => {
    const el = e.target.closest('.track-link');
    if (!el) return;

    // Stop the normal navigation until we've collected the data
    e.preventDefault();

    // Unit test that we have permission for geolocation
    // The call itself may fail if the user denies – that’s fine
    try {
      await navigator.geolocation.getCurrentPosition();
    } catch (_) {
      // geolocation denied – we’ll just fall back to IP
    }

    // Track the click
    await track(el.dataset.action);

    // --------------------------------------
    // 3️⃣  Now navigate – you can replace
    // --------------------------------------
    if (el.dataset.href) { // if you store URL in data-href
      window.location.href = el.dataset.href;
    } else {
      window.location.href = '#'; // or wherever your link is supposed to go
    }
  });

  // --------------------------------------------------------------------
  // 4️⃣  When the page loads – initial “visited” event
  // --------------------------------------------------------------------
  window.addEventListener('load', () => {
    // Send the “page visited” event asynchronously
    track('Page visited');
  });
</script>

</body>
</html>
